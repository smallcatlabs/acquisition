# cargo-about: the third-party notices every release archive carries
# (`THIRD-PARTY-NOTICES.md`, from `about.hbs`), generated by
# `.github/workflows/release.yml` (`PLATFORMS-SLICE.md` at `b6197a82`, question 5: "use
# cargo-about"). The licences accepted are `deny.toml`'s — the list the
# owner ruled, with its two exceptions; what cargo-deny refuses never
# reaches here. Over every target, not the five the release ships:
# cargo-about's target filter resolves a crate two targets declare under
# one name to one of them (keyring's `security-framework`, 2 for iOS and 3
# for macOS, dropped both for macOS), so the notices are a superset and
# `tools/notices-check.sh` holds that every shipped target's crates are
# in them. The version shown for such a crate can be the other target's;
# its licence and copyright are the same.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
workarounds = ["ring", "rustls"]
