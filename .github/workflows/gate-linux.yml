name: Gate (Linux)

# The quality gate on Linux (AGENTS.md,
# "Quality gate"), plus the one check only a Linux box can make: the
# daemon's keyring round trip against a real Secret Service
# (acquisition-daemon/src/auth.rs, `keyring_round_trip_survives_a_fresh_entry`).
# The runner has no desktop session, so gnome-keyring is started unlocked
# with a throwaway password inside a private D-Bus session — the keyring
# crate's own CI recipe. Nothing here talks to GGG: every harness sets
# ACQ_PROVIDER=mock (C88) and no test process has a terminal.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the docs check refuses a cited commit it cannot
      # find, and a shallow clone holds one commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The pinned toolchain and its components, as `rust-toolchain.toml`
      # names them: the runner's rustup reads the file.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      # The gate's test runner (AGENTS.md, "Quality gate"; `.config/
      # nextest.toml`, its `ci` profile), pinned.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # cargo-deny over the locked graph (`deny.toml`): RustSec advisories,
      # the licences an archive may carry, bans and sources. Here only —
      # the local gate does not install cargo-deny (C8 of the 2026-09-11
      # census).
      - name: Dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
          manifest-path: Cargo.toml

      - name: Install a Secret Service
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus

      # First, as the gate says: the process tests run the acqd this writes.
      - name: Build
        run: cargo build --workspace --locked

      # If this step breaks: a Secret Service *connection* error means the
      # session bus, so drop the dbus-run-session wrapper first (the keyring
      # crate's own CI runs the gnome-keyring-daemon line bare). The round
      # trip's *assertion* failing (Some(token) expected, None) means the
      # Linux build reached the keyring crate's mock store: check feature
      # unification. First run green 2026-09-12 (run 34704103311).
      # ACQ_CASES=full: the generated search properties at their full
      # counts; a session's gate runs a share of them, fresh each run
      # (acquisition-search/tests/common/generated.rs, `cases`). A property
      # that fails here and passed locally prints its seed.
      - name: Test, with the keyring round trip against an unlocked gnome-keyring
        run: |
          dbus-run-session -- bash -eo pipefail -c '
            eval "$(printf ci-throwaway | gnome-keyring-daemon --components=secrets --daemonize --unlock)"
            export ACQ_KEYRING_ROUNDTRIP=1
            export ACQ_CASES=full
            cargo nextest run --workspace --all-targets --locked --profile ci
          '

      # Every step after the test step runs after a red test step too
      # (`!cancelled()`), so one failing test hides no lint or check
      # (#77); the test step's failure still fails the job.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      # The gate's four checks beyond cargo (AGENTS.md, "Quality gate"):
      # until these, a tree that broke one passed here unless a session had
      # run the gate. The docs check notes, never fails on, the clone's
      # hooks; the architecture check reads the dependency graph through
      # cargo metadata and jq; the trade check runs the sitting tools'
      # self-tests.
      - name: The docs check
        if: ${{ !cancelled() }}
        run: tools/docs-check.sh

      - name: The architecture check
        if: ${{ !cancelled() }}
        run: tools/arch-check.sh

      - name: The trade check
        if: ${{ !cancelled() }}
        run: tools/trade-check.sh

      - name: The registry check
        if: ${{ !cancelled() }}
        run: python3 -I tools/bothy.py check

  # The checks' own breakers: each breaks what a check guards and requires
  # the check to refuse it by name, so a check that stopped refusing — one
  # that passes everything — fails here. Beside the gate, not in it: they
  # change rarely, and arch-check-breakers.sh edits the working tree's
  # manifests and restores them on exit (2 min here), safe in a clean
  # checkout and not under a session's edits. What they catch is the tree
  # moving under a case: two of the dependency guard's had failed unseen
  # since the search crate linked the planner (fb85d749).
  # sign-acqd-breakers.sh is not here: it needs macOS's codesign.
  breakers:
    runs-on: ubuntu-latest
    steps:
      # The whole history: docs-check.sh refuses a cited commit it cannot
      # find, and a shallow clone holds one commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # cargo metadata reads the graph the dependency guard checks; nothing
      # is built.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: The registry check's breakers
        run: tools/bothy-breakers.sh

      - name: The preflight's breakers
        run: tools/preflight-breakers.sh

      - name: The docs check's breakers
        run: tools/docs-check-breakers.sh

      - name: The architecture check's breakers
        run: tools/arch-check-breakers.sh
