name: Gate (Windows)

# The quality gate on Windows x86_64 (AGENTS.md, "Quality gate";
# `PLATFORMS-SLICE.md` at `b6197a82`, step 1): the build, the suite on the mock harness —
# the named-pipe endpoint (C112), the world's Windows arm — and clippy,
# which alone lints the `cfg(windows)` code. Formatting and cargo-deny do
# not vary by platform and stay with the Linux workflow. Plus the
# daemon's keyring round trip against Credential Manager
# (acquisition-daemon/src/auth.rs, `keyring_round_trip_survives_a_fresh_entry`).
# The tests run the commands the search prints through `sh`: Git for
# Windows' bin directory is on the runner's PATH. Nothing here talks to
# GGG: every harness sets ACQ_PROVIDER=mock (C88) and no test process has
# a terminal. First run green 2026-10-15 (run 38665185349, 800 tests, the
# round trip among them).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The pinned toolchain and its components, as `rust-toolchain.toml`
      # names them: the runner's rustup reads the file.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      # The gate's test runner (AGENTS.md, "Quality gate"; `.config/
      # nextest.toml`, its `ci` profile), pinned.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # First, as the gate says: the process tests run the acqd this writes.
      - name: Build
        run: cargo build --workspace --locked

      # The Windows gate tests what Windows changes: the named pipes
      # (C112), Credential Manager, spawn and handle semantics, and the
      # `cfg(windows)` code. The generated search properties are blind to
      # the platform, so they run the share tier here, a share of their
      # counts fresh each run (acquisition-search/tests/common/
      # generated.rs, `cases`), and their full volume stays with the Linux
      # gate: under full counts a starved runner met the `ci` profile's
      # termination on healthy code (#70). ACQ_KEYRING_ROUNDTRIP=1: the
      # round trip against the runner user's Credential Manager. Every
      # failure is reported (the `ci` profile's fail-fast = false): a
      # platform's failures come in kinds, and one test's must not hide
      # the next's.
      - name: Test, with the keyring round trip against Credential Manager
        env:
          ACQ_KEYRING_ROUNDTRIP: "1"
        run: cargo nextest run --workspace --all-targets --locked --profile ci

      # After a red test step too (`!cancelled()`): clippy is the only lint
      # of the `cfg(windows)` code, and a failing test must not hide it
      # (#77). The test step's failure still fails the job.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
