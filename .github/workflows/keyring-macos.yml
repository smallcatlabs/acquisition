name: Keychain round trip

# The daemon's keyring round trip against the macOS Keychain
# (acquisition-daemon/src/auth.rs, `keyring_round_trip_survives_a_fresh_entry`;
# C199, one Keychain job run twice; retired, its reason is this
# comment), the one platform a release names
# that no gate runs it on: Linux's gate runs it against gnome-keyring,
# Windows's against Credential Manager. The runner user's login
# keychain, unsigned test binary: it proves the backend round-trips
# through a fresh Entry, not the signed archive's item ACL.
#
# Its one definition, since a job copied into two workflows drifts
# apart, run in three places:
# - `release.yml`, on every dispatch and tag, whose `draft` needs it, so
#   a tag's release is not drafted until the pass is earned on the tagged
#   commit;
# - `weekly.yml`, so a break between releases (a bump of the keyring
#   crate, a new runner image) is found before the next one;
# - a dispatch by hand, here.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyring-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - uses: Swatinem/rust-cache@v2
      - name: The keyring round trip against the Keychain
        env:
          ACQ_KEYRING_ROUNDTRIP: "1"
        run: cargo nextest run --locked -p acquisition-daemon --lib --profile ci -E 'test(=auth::tests::keyring_round_trip_survives_a_fresh_entry)'
