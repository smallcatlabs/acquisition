[package]
name = "acquisition-search"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# One test binary of modules (`tests/main.rs`, C122), and each file that
# sets the process environment its own: named below, never discovered.
autotests = false

[dependencies]
# C89: the store, and the planner for the effective price a query reads
# (C81, C100; `price.rs`) — nothing else of the workspace
acquisition-plan = { path = "../acquisition-plan" }
acquisition-store = { path = "../acquisition-store" }
anyhow.workspace = true
# `~`, and every other text comparison: one any-case matcher (bind.rs)
regex = "1"
# the fold any-case `=` compares under, from the tables the matcher itself
# uses: two spellings of one value are told apart by it (bind.rs, `folded`)
regex-syntax = "0.8"
# the basis names the store by a short hash of its path, as C83 names a world
sha2 = "0.11"
# a continuation's token is its request, encoded for a terminal (answer.rs);
# a site search id is its query, base64url over gzip (trade.rs, S56)
base64 = "0.22"
# the one inflater, for a site search id (trade.rs, C113): no HTTP, no runtime
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
# the class table, a reviewed TOML file compiled into the binary (class.rs, C106)
toml.workspace = true

[dev-dependencies]
# the tests' only: proptest generates the trees the round trip runs over
proptest = "1.11.0"
# a test's own folder, removed on drop: never a name built from the pid
tempfile.workspace = true
# invariant 6's dump of every table; the store's own version and features,
# so the test build links the one SQLite the store does (C84)
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }

[build-dependencies]
# the build a basis names is a digest of sources (build.rs, C98)
sha2 = "0.11"

[[test]]
name = "main"
path = "tests/main.rs"
