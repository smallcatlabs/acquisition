text = 'rarity=rare'
fidelity = "exact"
statuses = { "type_filters.rarity" = "exact" }
matches = ['{}']
fails = ['{"rarity": "Magic"}']

[[case]]
name = "rarity: any but unique"
query = '{"filters": {"type_filters": {"filters": {"rarity": {"option": "nonunique"}}}}}'
text = '-rarity=unique'
fidelity = "exact"
statuses = { "type_filters.rarity" = "exact" }
matches = ['{}', '{"rarity": "Magic"}']
fails = ['{"rarity": "Unique"}']

[[case]]
name = "rarity: a foil unique, two terms, the whole query"
query = '{"filters": {"type_filters": {"filters": {"rarity": {"option": "uniquefoil"}}}}}'
text = 'rarity=unique is:isRelic'
fidelity = "ambiguous"
statuses = { "type_filters.rarity" = "ambiguous" }
matches = ['{"rarity": "Unique", "isRelic": true}']
fails = ['{"rarity": "Unique"}', '{"isRelic": true}']

[[case]]
name = "an option the site sends empty states nothing: the site's own no-op"
query = '{"filters": {"type_filters": {"filters": {"rarity": {"option": null}}}, "misc_filters": {"filters": {"fractured_item": {"option": null}}}}}'
text = 'true() true()'
fidelity = "exact"
statuses = { "type_filters.rarity" = "exact", "misc_filters.fractured_item" = "exact" }
matches = ['{}', '{"rarity": "Magic"}', '{"fractured": true}']

