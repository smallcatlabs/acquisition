# The translation's fixtures (C113, K6; step 4 of search/TRADE-PLAN.md),
# read by tests/trade_translate.rs. One case per catalogue row and per
# group type at least; every expected text worked by hand from the row's
# `lands` and the catalogue's header before the case ran.
#
# A case: `query` is the site's query object, or the `{query, sort}`
# envelope, as JSON; `url` instead a URL whose `{q1}`-style word is that
# captured id (tests/trade-decode.toml), whose query is the capture's.
# `text` the canonical text; `realm` the scope a URL carries; `fidelity`;
# `statuses` every clause the report holds, by where it stands, and its
# status. `matches` and `fails` are item bodies (JSON, over a rare Iron
# Ring in Standard; `_league` moves one) asked the text: every match
# matches and no fail does. A restrictive clause's fail is an item a
# weaker reading — a dropped bound, a lost source or flag, a lost not,
# a count — would match; a tautology's matches are items that differ in
# what it names. `covers` names the rows a case shows that no clause
# reads: the URL's and the JSON's, which are the decoder's, and
# `query.stats`'s empty group, which is no clause.

# ---- the URL, the JSON, the query object's keys ----------------------------------------------

[[case]]
name = "a pc URL: the realm the scope, the league a term"
url = "https://www.pathofexile.com/trade/search/Standard/{q2}"
covers = ["url.realm", "url.id"]
realm = "pc"
text = 'league=Standard category="armour.boots" rarity=rare line("#% chance to Suppress Spell Damage" source=explicit)'
fidelity = "ambiguous"
statuses = { "url.league" = "exact", "status" = "listing_only", "type_filters.category" = "exact", "type_filters.rarity" = "exact", "stats.0" = "exact", "stats.0.0" = "ambiguous" }
matches = ['{"baseType": "Iron Greaves", "typeLine": "Iron Greaves", "explicitMods": ["+12% chance to Suppress Spell Damage"]}']
fails = [
  '{"_league": "Hardcore", "baseType": "Iron Greaves", "typeLine": "Iron Greaves", "explicitMods": ["+12% chance to Suppress Spell Damage"]}',
  '{"baseType": "Iron Greaves", "typeLine": "Iron Greaves", "implicitMods": ["+12% chance to Suppress Spell Damage"]}',
]

[[case]]
name = "a console URL names its realm"
url = "https://www.pathofexile.com/trade/search/xbox/Standard/{q2}"
covers = ["url.realm", "url.id"]
realm = "xbox"
text = 'league=Standard category="armour.boots" rarity=rare line("#% chance to Suppress Spell Damage" source=explicit)'
fidelity = "ambiguous"
statuses = { "url.league" = "exact", "status" = "listing_only", "type_filters.category" = "exact", "type_filters.rarity" = "exact", "stats.0" = "exact", "stats.0.0" = "ambiguous" }

[[case]]
name = "the JSON envelope: its sort reported, never applied; a name the printer quotes"
query = '''{"query": {"status": {"option": "online"}, "name": "Kaom's Heart"}, "sort": {"price": "asc"}}'''
covers = ["json"]
text = '''name="Kaom's Heart"'''
fidelity = "exact"
statuses = { "status" = "listing_only", "name" = "exact", "sort" = "listing_only" }
matches = ['''{"name": "Kaom's Heart", "rarity": "Unique"}''']
fails = ['''{"name": "Kaom's Way", "rarity": "Unique"}''']

[[case]]
name = "a name holding the language's own marks reaches the binder as one text"
query = '''{"name": "a \"b\" or {bounds} \\ c"}'''
text = '''name="a \"b\" or {bounds} \\ c"'''
fidelity = "exact"
statuses = { "name" = "exact" }
matches = ['''{"name": "a \"b\" or {bounds} \\ c"}''']
fails = ['''{"name": "a"}''']

[[case]]
name = "the free-text term: a whole name or a whole base (w06, w07; t50, t51 found no word of one)"
query = '{"term": "Amber Amulet"}'
text = 'name="Amber Amulet" or base="Amber Amulet"'
fidelity = "exact"
statuses = { "term" = "exact" }
matches = [
  '{"typeLine": "Amber Amulet of the Meteor", "baseType": "Amber Amulet", "rarity": "Magic"}',
  '{"name": "Amber Amulet", "typeLine": "Onyx Amulet", "baseType": "Onyx Amulet"}',
]
fails = [
  '{"name": "Amber", "typeLine": "Onyx Amulet", "baseType": "Onyx Amulet"}',
  '{"typeLine": "Amber Amulets", "baseType": "Amber Amulets"}',
]

[[case]]
name = "a base with its variant: the base lands, the variant is the remainder"
query = '{"type": {"option": "Iron Ring", "discriminator": "legacy"}}'
text = 'base="Iron Ring"'
fidelity = "partial"
statuses = { "type" = "exact", "type.discriminator" = "unsupported" }
matches = ['{}']
fails = ['{"baseType": "Gold Ring", "typeLine": "Gold Ring"}']

[[case]]
name = "a key no row names, and the page's empty group, which is no group"
query = '{"type": "Iron Ring", "stats": [{"type": "and", "filters": []}], "seller": "x"}'
covers = ["query.stats"]
text = 'base="Iron Ring"'
fidelity = "partial"
statuses = { "type" = "exact", "seller" = "unsupported" }
matches = ['{}']
fails = ['{"baseType": "Gold Ring", "typeLine": "Gold Ring"}']

# ---- type_filters -----------------------------------------------------------------------------

[[case]]
name = "category"
query = '{"filters": {"type_filters": {"filters": {"category": {"option": "accessory.ring"}}}}}'
text = 'category="accessory.ring"'
fidelity = "exact"
statuses = { "type_filters.category" = "exact" }
matches = ['{}']
fails = ['{"baseType": "Rusted Sword", "typeLine": "Rusted Sword"}']

[[case]]
name = "a category no closed set holds is unsupported with the binder's words"
query = '{"filters": {"type_filters": {"filters": {"category": {"option": "armour.nope"}}}}}'
text = ''
fidelity = "partial"
statuses = { "type_filters.category" = "unsupported" }

[[case]]
name = "rarity"
query = '{"filters": {"type_filters": {"filters": {"rarity": {"option": "rare"}}}}}'
text = 'rarity=rare'
fidelity = "exact"
statuses = { "type_filters.rarity" = "exact" }
matches = ['{}']
fails = ['{"rarity": "Magic"}']

[[case]]
name = "rarity: any but unique"
query = '{"filters": {"type_filters": {"filters": {"rarity": {"option": "nonunique"}}}}}'
text = '-rarity=unique'
fidelity = "exact"
statuses = { "type_filters.rarity" = "exact" }
matches = ['{}', '{"rarity": "Magic"}']
fails = ['{"rarity": "Unique"}']

[[case]]
name = "rarity: a foil unique, two terms, the whole query"
query = '{"filters": {"type_filters": {"filters": {"rarity": {"option": "uniquefoil"}}}}}'
text = 'rarity=unique is:isRelic'
fidelity = "exact"
statuses = { "type_filters.rarity" = "exact" }
matches = ['{"rarity": "Unique", "isRelic": true}']
fails = ['{"rarity": "Unique"}', '{"isRelic": true}']

[[case]]
name = "an option the site sends empty states nothing: the site's own no-op"
query = '{"filters": {"type_filters": {"filters": {"rarity": {"option": null}}}, "misc_filters": {"filters": {"fractured_item": {"option": null}}}}}'
text = 'true() true()'
fidelity = "exact"
statuses = { "type_filters.rarity" = "exact", "misc_filters.fractured_item" = "exact" }
matches = ['{}', '{"rarity": "Magic"}', '{"fractured": true}']

# ---- weapon_filters ---------------------------------------------------------------------------

