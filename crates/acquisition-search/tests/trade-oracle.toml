# The oracle's expected disagreements (C113, K6), read by
# tests/trade_oracle.rs: every item the site returned for a search whose
# translation has no remainder, that the translated text does not match.
# The set is exact — a new disagreement and a vanished one each fail the
# test.
#
# A `finding` is stated once: `home` is where its answer lives — `site`, a
# fact of the captures, its clause labelled by the catalogue `row` it names
# (and the test holds that clause ambiguous); `ruling`, the owner's, quoted;
# `sitting`, a question for a sitting. Every finding names the `row` that
# labels its clause, and the test holds the clause, or a filter under it,
# ambiguous by it — no expected disagreement sits under a clause reported
# exact — but a ruling by which the owner chose to differ from the site,
# `differs = true`, which names none; `patch`, an item a game patch
# reworded after its capture: its clause's stat is one 3.30 moved, so the
# item, fetched before, shows a wording no translation gives; it names no
# row and differs by no ruling. `body`, an item as GGG sends it that does
# not carry what the site matched on: an unidentified item, its name empty
# in the body and held by the site's index, refused by the name's clause
# alone (the test holds both); it names no row and differs by no ruling,
# the clause read as the site reads it. A `sitting` finding `asks` what the sitting
# is to settle, each answered by searches with a mutant (the site-sitting
# skill). A `build` finding is a question a sitting has answered and the
# translation does not build yet: it names its row, held ambiguous as a
# question's is, asks nothing more, and its cites name the issue that
# builds it. Nothing here is a tolerance: each is the site reading a clause
# otherwise, and the translation is fixed when its finding is answered.
#
# A `row` is one search's items under one finding: `items` by their index in
# the fetch (search/pseudo-stats/data/bodies.json), `outcome` `missed` or
# `undecided`, `clauses` the paths of the top-level clauses whose term alone
# refuses the item (the translation's report, `path`).
#
# Measured by the test: 832 searches run, 7,802 items, 7,141 matched,
# 661 missed in 74 rows, none undecided; y10, of twenty crucible ids, is
# partial. A row of a search a sitting ran is a search that asked its
# question, classified by the search; a row of another search is
# classified by a script from each item's lines; every row's items are
# read by hand against its finding. A finding states what the translation
# is to build, and a row it builds leaves the set; what stays ambiguous
# stays under its finding, labelled by its row.

[[finding]]
key = "eldritch-not"
home = "site"
row = "stat.text.eldritch"
cites = "search/pseudo-stats/README.md, 'Two things the searches could not do': a `not` on an eldritch form's id lets some items carrying it through (round four, 227 items); unexplained, which items it lets through unread"

[[finding]]
key = "twin-counted"
differs = true
home = "ruling"
cites = "the twin id of `+# to Strength and Intelligence` on That Which Was Taken, which the site leaves out of total life, Strength and Intelligence (c3, b1, b2, e053, e057) and the totals table counts — the owner, step 9c (search/LEDGER.md): \"I believe this is a bug. Let's count the mod\"; the park in decisions/search.md. Since 3.30 no listed item carries the twin id (y20, y21, za02 found none, 2026-11-17), and the jewel's line sits under the ordinary id (za01's two that show it); these rows are items fetched before. The sitting of 2026-11-24 answered #34: the jewel with the line under the ordinary id and the four totals in a `not` found none (zf07), and with them shown (zf16) each of the ten shows the line counted at 1 in total Strength and Intelligence and at a half in total life and mana, as the ordinary line is elsewhere (T44)"

[[finding]]
key = "socketed-gems-counted"
differs = true
home = "ruling"
cites = "`# to Level of Socketed Skill Gems`, which the site leaves out of `+# total to Level of Socketed Skill Gems` (e103, f030, f031) and the totals table counts — the owner, step 9c (search/LEDGER.md; search/pseudo-stats/data/table-changes.csv): \"yes, include the socketed skill gems\""

[[finding]]
key = "reduced-spelling"
home = "ruling"
row = "stat.text.forms"
cites = "the site files a line's `reduced` spelling under its `increased` id and reads its number below nothing: The Anvil's `10% reduced Attack Speed` meets `max` -5 and not -11 (t01–t03), and The Blood Reaper's `increased Mana Cost` under the `reduced` text meets `max` -1 (t04) — a stat however displayed (round t, 2026-10-16); the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" Built at 7e under the choice before it (the owner, 2026-10-17): presence over every form, and a bound the sum of the text and its plurals, ambiguous by its row until a named stat value, the language naming a stat however displayed (#46)"

[[finding]]
key = "no-physical-damage"
home = "ruling"
row = "stat.text.forms"
cites = "the site files `No Physical Damage` under the id of `#% increased Physical Damage` (e061, h046, h047) with a number the text never shows: about -120 and not one number — Storm Clouds of one display meet `min` -119 and others not (t07–t09, w01–w05); the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" Presence alone is read from it: built at 7e, t09 matched, a bound ambiguous by its row"

[[finding]]
key = "displayed-forms"
home = "ruling"
row = "stat.text.forms"
cites = "the site files a stat's other displays under its id: an elided 100 % (`Trigger Commandment of Ire when Hit`, met at `min` 100, t10, t11), `an` for one (`Projectiles Pierce an additional Target`, met at 1..1, t12), a plural (`… for 4 seconds`, t27, t29); the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" Built at 7e (reference/trade-forms-v1.toml): presence over every form and a plural summed, t11, t27 and t29 matched; a numberless form under a bound ambiguous by its row, never an alternative computed from the bound. A plural the forms table's reader misses is such a form: `# Added Passive Skills are Jewel Sockets` at 1..1 fetched ten cluster jewels each displaying `1 Added Passive Skill is a Jewel Socket` (zf09, the sitting of 2026-11-24), which the table calls `other`, and at `min` 2 only the plural (zf11): the site reads the singular's 1 under a bound (T45, #318)"

[[finding]]
key = "map-tier-unnamed"
home = "ruling"
row = "map_filters.map_tier"
cites = "the site gives Shaper Guardian Map, whose base names no tier, tier 16 (u065); `map_tier` reads the base's `(Tier N)` alone; the owner, 2026-10-16: \"Let's do a tier table for maps, either now or parked for later based on your judgement\" — parked, no registered source holding tiers (decisions/trade.md); until it is built such a map is ambiguous under `map_tier`"

[[finding]]
key = "scourge-in-sum"
row = "stat.scourge.summed"
home = "sitting"
cites = "e043 and f005 returned one item, crafted `+28% to Fire Resistance` and scourge `-28% to Fire Resistance`, under a weighted group naming both ids with `min` 0.5; the site showed its sum as 28 and its total as nothing (a sum of nothing, search/pseudo-stats/README.md). The sitting of 2026-11-17 asked the two lines alone: y14 found two items carrying a crafted Fire Resistance of 1 or more and a scourge one below nothing, the same Maelström Finger Unset Ring (+28%, -28%) and a belt (+34%, -17%); the two ids weighted 1 each found the ring at `max` 0 (y15) and the belt alone at `min` 1 (y16). The site counts the scourge line in a weighted sum, as this search does; what lifted the ring to `min` 0.5 under e043's wider group of 21 ids was unexplained. The sitting of 2026-11-24 answered it: the ring alone (zf12) and under e043's whole group at `min` 0.5 (zf13, its sum shown 28 again) were found, and under the explicit Fire Resistance id alone at `min` 0.5 (zf14) it was found with its sum shown 28, where the group's other 18 ids found none (zf15). The site counts the crafted line under the explicit id as well as the crafted, so a group naming both counts it twice, 28 + 28 - 28 (T46); the translation counts a line once, and is fixed when the build is taken up (#33)"
asks = "whether the site counts every crafted line under its stat's explicit id as well, or this stat's alone, before the build reads it so of every stat: an item with another crafted line, under that stat's explicit id alone in a weighted group whose bound only the crafted line meets"

[[finding]]
key = "blighted-base"
row = "query.type.map"
home = "build"
cites = "t55 asked `map_blighted` `true` under the Base `Map (Tier 13)`, and the site returned ten maps whose base the body names `Blighted Map (Tier 13)` (search/pseudo-stats/data/bodies.json): its Base reads a blighted map's base without the prefix; `base=` is the whole base (step 7f, when t55 first ran). The sitting of 2026-11-17 answered it for the other prefix: y18 asked `map_uberblighted` `true` under `Map (Tier 16)` and found 3,427, the ten fetched each a `Blight-ravaged Map (Tier 16)`; the site refused as a search the Base `Blighted Map (Tier 13)` (y17) and `Blight-ravaged Map (Tier 16)` (y19), which no capture holds: the owner, 2026-11-17, \"y17 and y19 returned a ggg error about an invalid search, so nothing was saved\". The Base is the unprefixed name, under both prefixes; the translation is fixed when the build is taken up. The refusal cannot be captured: opened again on 2026-11-24, the page refused both before sending any search, the owner: \"return no results and raise an error: 'Failed to load search state. The search is no longer valid.'\" (T47). #283 builds it"

[[finding]]
key = "pair-mean"
row = "stat.text.many"
home = "build"
cites = "y07 asked the heist weapon's `# to # added Fire Damage` and its minions' twin, one id of four numbers (stat_190652296), at `min` 19 `max` 19: the site found 29, and all ten fetched read `16 to 22` twice, the pair's mean 19 and no number of the line 19; y08, unbounded, showed other pairs (the sitting of 2026-11-17). The translation compares the first number, 16; the site compares the pair's mean, as on a text of exactly two `#` (round x, `stat.text.bounds`); the translation is fixed when the build is taken up. Which pair when an item's two differ cannot be asked: every four-number text the site lists is one roll shown twice. On a text of two `#` with no `# to #` beside a written digit the site compares the first number, as the translation does: Kitava's Thirst's `#% chance … at least # Mana … with a 0.1 second Cooldown`, every fetched line at 100 Mana, found items at 50..50 (zf19, each line 50%) and none at 75 or 100 (zf18, zf20; the sitting of 2026-11-24, T48). #283 builds it"

[[finding]]
key = "links-max-zero"
row = "socket_filters.links"
home = "sitting"
cites = "zg02 asked `socket_filters.links` at `max` 0 alone under body armour (the sitting of 2026-11-24): the site found 10,000, and each of the ten fetched has no two sockets linked, one to three sockets each, where the ten of other body armour searches with no link bound have three or four such (zc02, zc03, zf01). The `min` 5 beside it found none (zf05), as the inverted 5..1 did (zg03), where `min` 5 alone found five- and six-links (zf06). So the site reads a Link Groups `max` of 0 as a bound, unlike Sockets' (T38), and an unlinked socket meets it; the translation's `linked(size<=0)` meets no item with a socket (T43, #309)"
asks = "how the site counts a lone socket on Link Groups: a `max` of 0 takes it (zg02) and a `min` of 1 takes a lone abyssal one (zb10) — Link Groups `max` 0 under belts, beside `min` 1 under body armour, says whether a lone socket is a group of none or of one, and whether an item with no socket meets the `max`"

[[finding]]
key = "reworded-330"
home = "patch"
cites = "#276: 3.30 reworded the stat in place after the sitting's capture, and a stat translates to the text of the stats capture the table is made from and to no earlier text; the item, fetched before the patch, shows the old wording. Its stat is one the test finds moved between the captures of 2026-09-12 and 2026-11-17 (`stats_moved_at_330`)"

[[finding]]
key = "unidentified-name"
home = "body"
cites = "zd04 (round zd, 2026-11-23, #303): the site's `name` Redbeak with `type` Rusted Sword fetched an unidentified Rusted Sword among ten, its body's `name` empty and `identified` false, so `name=\"Redbeak\"` cannot meet it: the site matches an unidentified unique by the name its index holds and GGG's body does not carry (T41)"

[[finding]]
key = "quality-max-zero"
row = "misc_filters.quality"
home = "sitting"
cites = "zc03 asked `misc_filters.quality` at `max` 0 under body armour: the site found 10,000, and all ten fetched show no `Quality`, so the field is absent and `quality<=0` is false on each (C93). The sitting of 2026-11-23 found the site reads a Sockets `max` of 0 as no bound (zc02, T38). The sitting of 2026-11-24 asked the pair that parts the readings: `quality` at `min` 20 with `max` 0 found 10,000 and each of the ten fetched shows no quality (zf01), where `min` 20 alone fetched ten at 20 % or more (zf02) and the inverted 20..5 found none (zg01). So the site neither reads the 0 as no bound, which would keep the `min`, nor the pair as a range, which nothing meets: beside a `max` of 0 the `min` is left out. The translation reads the pair as a range that runs backwards, and the clause is ambiguous by its row and the `max` of 0 (T43, #309)"
asks = "whether the site's Quality `max` of 0 bounds at all, or is the whole filter left out: `quality` `max` 0 under a category whose listed items mostly show a quality, such as skill gems — an item showing a quality found, no bound; each fetched with none, it bounds and an item with no quality meets it, so the row wants `lacked = \"meets_maximum\"` as the requirement rows have"

