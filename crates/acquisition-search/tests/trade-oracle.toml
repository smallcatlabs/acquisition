# The oracle's expected disagreements (C113, K6; step 6 of
# search/TRADE-PLAN.md), read by tests/trade_oracle.rs: every item the site
# returned for a search whose translation has no remainder, that the
# translated text does not match. The set is exact — a new disagreement and
# a vanished one each fail the test.
#
# A `finding` is stated once: `home` is where its answer lives — `site`, a
# fact of the captures, its clause labelled by the catalogue `row` it names
# (and the test holds that clause ambiguous); `ruling`, the owner's, quoted;
# `sitting`, a question for a sitting. Every finding names the `row` that
# labels its clause, and the test holds the clause, or a filter under it,
# ambiguous by it — no expected disagreement sits under a clause reported
# exact — but a ruling by which the owner chose to differ from the site,
# `differs = true`, which names none (the outside review of 8f293ff3);
# `sitting`, a question for step 7, `asks` what the sitting is to settle,
# each answered by searches with a mutant (the site-sitting skill). Nothing
# here is a tolerance: each is the site reading a clause otherwise, and the
# translation is fixed when its finding is answered.
#
# A `row` is one search's items under one finding: `items` by their index in
# the fetch (search/pseudo-stats/data/bodies.json), `outcome` `missed` or
# `undecided`, `clauses` the paths of the top-level clauses whose term alone
# refuses the item (the translation's report, `path`).
#
# Measured at writing (2026-10-16), by the test: 518 searches run, 4,733
# items, 4,236 matched, 497 missed in 55 rows, none undecided — 377 items
# the eldritch `not`, 61 the `reduced` spelling, 21 `No Physical Damage`,
# 25 the twin and 10 the skill gems by the owner's rulings, 2 (one item
# twice) the scourge line, 1 q6. Classified by a script from each item's
# lines, and each item's lines read by hand against its finding.
# Step 7's sitting (rounds t to w, 2026-10-16) added 242 searches run and
# 2,402 items, 192 of them missed in 26 rows, none undecided: 760 searches,
# 7,135 items, 6,446 matched, 689 missed in 81 rows. Each of the sitting's
# rows is a search that asked its question, classified by the search, its
# items read by hand. Its questions answered, three findings moved from the
# sitting to the owner's ruling and eight were added under it; each states
# what step 7e builds, and a row it builds leaves the set.
# Step 7e built them (2026-10-17): 101 items left the set in 17 rows —
# presence over every form (t01, t09, t11, c4), the stat summed (q6,
# t17–t19), a plural summed (t27, t29), and the fields widened (t41, t42,
# t46, t48, t49, u061, u090) — none came in, and seven findings went with
# their rows: 760 searches, 7,135 items, 6,547 matched, 588 missed in 64
# rows. What stays ambiguous stays under its finding, labelled by its row.
# Step 7f (2026-10-17) let five searches run that were partial — t37, t38,
# t55, t56, u059: 50 items, 40 matched — and t55's ten are a new question
# for the sitting, `blighted-base`: 765 searches, 7,185 items, 6,587
# matched, 598 missed in 65 rows.

[[finding]]
key = "eldritch-not"
home = "site"
row = "stat.text.eldritch"
cites = "search/pseudo-stats/README.md, 'Two things the searches could not do': a `not` on an eldritch form's id lets some items carrying it through (round four, 227 items); unexplained, which items it lets through unread"

[[finding]]
key = "twin-counted"
differs = true
home = "ruling"
cites = "the twin id of `+# to Strength and Intelligence` on That Which Was Taken, which the site leaves out of total life, Strength and Intelligence (c3, b1, b2, e053, e057) and the totals table counts — the owner, step 9c (search/LEDGER.md): \"I believe this is a bug. Let's count the mod\"; the park in decisions/search.md"

[[finding]]
key = "socketed-gems-counted"
differs = true
home = "ruling"
cites = "`# to Level of Socketed Skill Gems`, which the site leaves out of `+# total to Level of Socketed Skill Gems` (e103, f030, f031) and the totals table counts — the owner, step 9c (search/LEDGER.md; search/pseudo-stats/data/table-changes.csv): \"yes, include the socketed skill gems\""

[[finding]]
key = "reduced-spelling"
home = "ruling"
row = "stat.text.forms"
cites = "the site files a line's `reduced` spelling under its `increased` id and reads its number below nothing: The Anvil's `10% reduced Attack Speed` meets `max` -5 and not -11 (t01–t03), and The Blood Reaper's `increased Mana Cost` under the `reduced` text meets `max` -1 (t04) — a stat however displayed (round t, 2026-10-16); the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" Built at 7e under the choice before it (the owner, 2026-10-17): presence over every form, and a bound the sum of the text and its plurals, ambiguous by its row until the park \"A named stat value\" (decisions/search.md)"

[[finding]]
key = "no-physical-damage"
home = "ruling"
row = "stat.text.forms"
cites = "the site files `No Physical Damage` under the id of `#% increased Physical Damage` (e061, h046, h047) with a number the text never shows: about -120 and not one number — Storm Clouds of one display meet `min` -119 and others not (t07–t09, w01–w05); the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" Presence alone is read from it: built at 7e, t09 matched, a bound ambiguous by its row"

[[finding]]
key = "displayed-forms"
home = "ruling"
row = "stat.text.forms"
cites = "the site files a stat's other displays under its id: an elided 100 % (`Trigger Commandment of Ire when Hit`, met at `min` 100, t10, t11), `an` for one (`Projectiles Pierce an additional Target`, met at 1..1, t12), a plural (`… for 4 seconds`, t27, t29); the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" Built at 7e (reference/trade-forms-v1.toml): presence over every form and a plural summed, t11, t27 and t29 matched; a numberless form under a bound ambiguous by its row, never an alternative computed from the bound"

[[finding]]
key = "map-tier-unnamed"
home = "ruling"
row = "map_filters.map_tier"
cites = "the site gives Shaper Guardian Map, whose base names no tier, tier 16 (u065); `map_tier` reads the base's `(Tier N)` alone; the owner, 2026-10-16: \"Let's do a tier table for maps, either now or parked for later based on your judgement\" — parked, no registered source holding tiers (decisions/trade.md); until it is built such a map is ambiguous under `map_tier`"

[[finding]]
key = "scourge-in-sum"
row = "stat.scourge.summed"
home = "sitting"
cites = "e043 and f005 returned one item, crafted `+28% to Fire Resistance` and scourge `-28% to Fire Resistance`, under a weighted group naming both ids with `min` 0.5; the site showed its sum as 28 and its total as nothing (a sum of nothing, search/pseudo-stats/README.md)"
asks = "whether a weighted group counts a scourge line — the item under the scourge id alone, and the crafted id alone"

[[finding]]
key = "blighted-base"
row = "query.type.map"
home = "sitting"
cites = "t55 asked `map_blighted` `true` under the Base `Map (Tier 13)`, and the site returned ten maps whose base the body names `Blighted Map (Tier 13)` (search/pseudo-stats/data/bodies.json): its Base reads a blighted map's base without the prefix; `base=` is the whole base (step 7f, when t55 first ran)"
asks = "whether the site's Base names a blighted map by its unblighted base alone — `Blighted Map (Tier 13)` under `type` `Map (Tier 13)`, and under `type` `Blighted Map (Tier 13)` — and whether any other prefix (`Blight-ravaged`) is read so"

