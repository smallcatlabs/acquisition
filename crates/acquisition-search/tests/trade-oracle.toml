# The oracle's expected disagreements (C113, K6; step 6 of
# search/TRADE-PLAN.md), read by tests/trade_oracle.rs: every item the site
# returned for a search whose translation has no remainder, that the
# translated text does not match. The set is exact — a new disagreement and
# a vanished one each fail the test.
#
# A `finding` is stated once: `home` is where its answer lives — `site`, a
# fact of the captures, its clause labelled by the catalogue `row` it names
# (and the test holds that clause ambiguous); `ruling`, the owner's, quoted;
# `sitting`, a question for step 7, `asks` what the sitting is to settle,
# each answered by searches with a mutant (the site-sitting skill). Nothing
# here is a tolerance: each is the site reading a clause otherwise, and the
# translation is fixed when its finding is answered.
#
# A `row` is one search's items under one finding: `items` by their index in
# the fetch (search/pseudo-stats/data/bodies.json), `outcome` `missed` or
# `undecided`, `clauses` the paths of the top-level clauses whose term alone
# refuses the item (the translation's report, `path`).
#
# Measured at writing (2026-10-16), by the test: 518 searches run, 4,733
# items, 4,236 matched, 497 missed in 55 rows, none undecided — 377 items
# the eldritch `not`, 61 the `reduced` spelling, 21 `No Physical Damage`,
# 25 the twin and 10 the skill gems by the owner's rulings, 2 (one item
# twice) the scourge line, 1 q6. Classified by a script from each item's
# lines, and each item's lines read by hand against its finding.
# Step 7's sitting (rounds t to w, 2026-10-16) added 242 searches run and
# 2,402 items, 192 of them missed in 26 rows, none undecided: 760 searches,
# 7,135 items, 6,446 matched, 689 missed in 81 rows. Each of the sitting's
# rows is a search that asked its question, classified by the search, its
# items read by hand. Its questions answered, three findings moved from the
# sitting to the owner's ruling and eight were added under it; each states
# what step 7e builds, and a row it builds leaves the set.

[[finding]]
key = "eldritch-not"
home = "site"
row = "stat.text.eldritch"
cites = "search/pseudo-stats/README.md, 'Two things the searches could not do': a `not` on an eldritch form's id lets some items carrying it through (round four, 227 items); unexplained, which items it lets through unread"

[[finding]]
key = "twin-counted"
home = "ruling"
cites = "the twin id of `+# to Strength and Intelligence` on That Which Was Taken, which the site leaves out of total life, Strength and Intelligence (c3, b1, b2, e053, e057) and the totals table counts — the owner, step 9c (search/LEDGER.md): \"I believe this is a bug. Let's count the mod\"; the park in decisions/search.md"

[[finding]]
key = "socketed-gems-counted"
home = "ruling"
cites = "`# to Level of Socketed Skill Gems`, which the site leaves out of `+# total to Level of Socketed Skill Gems` (e103, f030, f031) and the totals table counts — the owner, step 9c (search/LEDGER.md; search/pseudo-stats/data/table-changes.csv): \"yes, include the socketed skill gems\""

[[finding]]
key = "reduced-spelling"
home = "ruling"
cites = "the site files a line's `reduced` spelling under its `increased` id and reads its number below nothing: The Anvil's `10% reduced Attack Speed` meets `max` -5 and not -11 (t01–t03), and The Blood Reaper's `increased Mana Cost` under the `reduced` text meets `max` -1 (t04) — a stat however displayed (round t, 2026-10-16); the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" How a bound on a stat of an opposite-sign form is written is the open choice of search/TRADE-PLAN.md, \"What step 7 found\""

[[finding]]
key = "no-physical-damage"
home = "ruling"
cites = "the site files `No Physical Damage` under the id of `#% increased Physical Damage` (e061, h046, h047) with a number the text never shows: about -120 and not one number — Storm Clouds of one display meet `min` -119 and others not (t07–t09, w01–w05); the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" Presence alone is read from it"

[[finding]]
key = "stat-summed"
home = "ruling"
cites = "an explicit id holds the stat's crafted and fractured lines (t13, t15: none listed outside it) and a bound compares their sum: every item of t17 and t18 meets `min` 150 by two Life lines and by neither alone, and q6's item meets 157 and not 158 (t19, t20; q6, the owner's); the translation compares one line (C92); the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" A bound is `sum(line(T source=explicit).arg1)`"

[[finding]]
key = "displayed-forms"
home = "ruling"
cites = "the site files a stat's other displays under its id: an elided 100 % (`Trigger Commandment of Ire when Hit`, met at `min` 100, t10, t11), `an` for one (`Projectiles Pierce an additional Target`, met at 1..1, t12), a plural (`… for 4 seconds`, t27, t29); the translation writes the listed text alone (the forms measured at step 7a: 72 under 71 ids); the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" How a numberless form meets a bound is the open choice of search/TRADE-PLAN.md, \"What step 7 found\""

[[finding]]
key = "dps-at-quality"
home = "ruling"
cites = "the site's `pdps` and `dps` put 20 % quality in: a weapon of no quality displaying 347 physical dps meets `pdps` `min` 400, 416 at 20 % (t41; t42, 8 of 10); `pseudo.dps` reads the damage as displayed; the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" The filters land on the damage at 20 % quality"

[[finding]]
key = "area-level-monster-level"
home = "ruling"
cites = "the site's `area_level` reads a Blood-filled Vessel's `Monster Level` (t46, 10 of 10); the field reads `Area Level` alone; the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" The field reads both"

[[finding]]
key = "heist-skill-requirement"
home = "ruling"
cites = "the site's heist skill filters read a lockpick's `Level n in Lockpicking` requirement (t48, 10 of 10); the field reads a contract's `Requires Lockpicking (Level n)` alone; the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" The field reads both"

[[finding]]
key = "catalyst-quality"
home = "ruling"
cites = "the site's `quality` folds a ring's `Quality (Attribute Modifiers)` and its kind in (t49, 10 of 10); the field reads `Quality` alone; the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" The field folds them in"

[[finding]]
key = "no-requirement"
home = "ruling"
cites = "an item with no requirement meets the site's `req_filters.lvl` `max` 20 (u061: Redbeak, twice); `reqlevel` lacks it; the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" No requirement meets any maximum"

[[finding]]
key = "map-tier-unnamed"
home = "ruling"
cites = "the site gives Shaper Guardian Map, whose base names no tier, tier 16 (u065); `map_tier` reads the base's `(Tier N)` alone; the owner, 2026-10-16: \"Let's do a tier table for maps, either now or parked for later based on your judgement\" — parked, no registered source holding tiers (decisions/search.md); until it is built such a map is ambiguous under `map_tier`"

[[finding]]
key = "gem-at-max-level"
home = "ruling"
cites = "a gem at its maximum level, which displays no experience, meets the site's `gem_level_progress` `min` 50 (u090: `Portal`, `Level 1 (Max)`); `experience` lacks it; the owner, 2026-10-16, on the sitting's findings: \"I accept all your recommendations.\" A gem at its maximum level is at 100 %"

[[finding]]
key = "scourge-in-sum"
home = "sitting"
cites = "e043 and f005 returned one item, crafted `+28% to Fire Resistance` and scourge `-28% to Fire Resistance`, under a weighted group naming both ids with `min` 0.5; the site showed its sum as 28 and its total as nothing (a sum of nothing, search/pseudo-stats/README.md)"
asks = "whether a weighted group counts a scourge line — the item under the scourge id alone, and the crafted id alone"

