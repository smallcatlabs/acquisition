# ---- gems and the rest --------------------------------------------------

[[field]]
name = "quality"
array = "properties"
property = [
    "Quality",
    "Quality (Attack Modifiers)",
    "Quality (Attribute Modifiers)",
    "Quality (Caster Modifiers)",
    "Quality (Critical Modifiers)",
    "Quality (Defence Modifiers)",
    "Quality (Elemental Damage Modifiers)",
    "Quality (Life and Mana Modifiers)",
    "Quality (Physical and Chaos Damage Modifiers)",
    "Quality (Prefix Modifiers)",
    "Quality (Resistance Modifiers)",
    "Quality (Speed Modifiers)",
    "Quality (Suffix Modifiers)",
]
reads = "number"
plus = true
unit = "%"
whole = true
definition = "the displayed `Quality`, in percent, and a catalysed ring's or amulet's, `Quality (Resistance Modifiers)` and its eleven kin, which the trade site's Quality reads too (t49); a map's `Quality (Quantity)` and its kin are names of their own and not read"

[[field]]
name = "level"
array = "properties"
property = ["Level"]
reads = "number"
whole = true
marks = [" (Max)"]
definition = "a gem's displayed `Level`, `(Max)` beside it read and dropped; the level an item requires is `reqlevel`"

[[field]]
name = "experience"
array = "additionalProperties"
property = ["Experience"]
reads = "percent"
at_max = 100
definition = "a gem's experience as the percent of its level's: `Experience: a/b` as 100 × a ÷ b, cut to five decimals toward nothing, so one point short is never 100; a gem at its maximum level, `Level 20 (Max)`, displays none and is at 100, as the trade site reads it (u090)"

[[field]]
name = "stored_experience"
array = "properties"
property = ["Stored Experience: {0}"]
reads = "number"
whole = true
definition = "the displayed `Stored Experience`"
