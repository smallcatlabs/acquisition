# The property table — v1 (C114, C101, C106; decisions/search.md), step 3
# of search/TRADE-PLAN.md.
#
# Reference data: reviewed by hand, committed, shipped inside the binary
# (`include_str!` in `src/properties.rs`), read-only, never in a store file,
# printed field by field by `acq search --describe fields`, cited by version
# in every basis (C98). One row per field over a property the game displays:
# every numeric property the trade site's filters read that the catalogue
# (reference/trade-catalogue-v1.toml) lands as a field, named by the
# displayed name (owner, 2026-10-15: "build all using displayed names") —
# lowercased, spaces as underscores, `.of` the second number of a `#/#`
# value, `.q20` a defence at 20 % quality — and the one field over the base
# type the catalogue names, `map_tier`. Written from GGG's bodies as the
# census's store copy displays them (2026-09-13, 22,623 pc items) and the
# site's property bridge (S55; search/trade-query/data/grammar.json,
# `property_type_to_field`): data, what the game displays — never a
# judgment. No general accessor: a property is reached by a row here (C101).
#
# What a row means. `name` is the field. `array` is the body's key the
# property sits in (`properties`, `additionalProperties`, `requirements`);
# `property` the names GGG gives it there, any one of them, as the deriver
# shows them (markup reduced), a `{0}` kept where the name holds one;
# `value` which of its values is read, from 0, by every row that reads a
# property, a q20 row too; `select` a value that must be
# the word named for the property to be this field's — one property shape
# for nine heist skills; `also` a second array the property is displayed
# in, by its names there, read by the same value and select (a heist
# item's own requirement, `Level {0} in {1}`, t48); `at_max`, on a
# `percent` row, the value of an item displaying none whose `level` row
# reads its value beside a mark — a gem at its maximum level displays no
# experience, and the trade site reads it at 100 (u090). The sitting of
# 2026-10-16 (rounds t to w, tests/trade-oracle.toml) widened four rows to
# what the site's filter reads: `area_level` a vessel's `Monster Level`
# (t46), the heist skills a heist item's requirement (t48), `quality` the
# twelve catalysts' kinds (t49; ten in the captures, the twelve named in
# PathOfBuilding at its pin, src/Classes/ItemsTab.lua), `experience` a gem
# at its maximum (u090). `reads`:
#   number       the value is a number: digits, a point and digits unless
#                `whole`; a `+` before it where `plus`, the `unit` after it
#                and then one of `marks` — each read where written, and
#                nothing else beside it.
#   numerator    the value is `a/b`, two whole numbers; the field is a.
#   denominator  the same; the field is b.
#   percent      the same; the field is the percent a is of b, cut to five
#                decimals toward nothing, so 1 short of b is never 100.
#   q20          the displayed defence, a whole number, with the item's
#                quality taken out and 20 % put in (S26): the display times
#                120 over (100 + the quality), rounded half up. At 20 %
#                quality or more, or under the enchant `Quality does not
#                increase Defences` (the defence table's row that drops
#                quality, J6), the display itself. The quality is the
#                `quality` row's reading; an item displaying none has none.
#                The `quality` and `attacks_per_second` rows are read by the
#                search's own values (the q20 rows, the percentile, the
#                damage fields), so the loader refuses a table without them.
#   tier         no property: the base type's ` (Tier N)`, the number N.
#
# One status (rule 8 of the plan, C93): an item that displays no such
# property, and could hide none, lacks the field — known absence, false and
# never zero. The field is unread — undecided, its comparisons open — where
# the body, the array, or an element of it whose name is unread or is the
# row's could not be read; where the property is displayed as other than the
# row reads, or more than once; and for `q20` where neither the quality nor
# the enchant settles it — the quality could not be read, or, with no
# enchant read, an array of lines that may hold it could not be, and
# neither is known to keep the display. Nothing else of the item opens it.
#
# The q20 rule against the site's own figure (`extended.ar|ev|es|ward` of a
# fetched listing), measured when the table was written, by
# tests/properties.rs: within one on every row — over the 4,819 items the
# sitting's 864 captures fetched (search/pseudo-stats/data/captures.json),
# 1,148 of 1,313 rows equal and 165 one off; over the owner's eight searches'
# 70 (search/trade-query/data/fetch-census.json), 32 of 37 equal and 5 one
# off. The site works from the roll, which the display has rounded, so the
# display does not fix its figure; at 20 % quality or more, and under the
# enchant, the site's figure is the display on all 164 rows.
#
# Measured on the census's store copy (2026-09-13): `(Tier N)` on 1,105
# maps over 35 bases — 634 normal, 69 magic, 354 rare, 48 unique — and on
# nothing else; no property of the copy is displayed twice, and every value
# a row reads is in the shape its row states.

version = 1
source = "GGG's displayed properties as the census's store copy holds them (2026-09-13, 22,623 pc items), named as displayed; the site's property bridge (S55, search/trade-query/data/grammar.json); the q20 rule S26, measured against search/pseudo-stats/data/captures.json and search/trade-query/data/fetch-census.json"

# ---- weapons ------------------------------------------------------------

[[field]]
name = "attacks_per_second"
array = "properties"
property = ["Attacks per Second"]
reads = "number"
definition = "a weapon's `Attacks per Second`, as displayed — local modifiers applied by the game"

[[field]]
name = "critical_strike_chance"
array = "properties"
property = ["Critical Strike Chance"]
reads = "number"
unit = "%"
definition = "the displayed `Critical Strike Chance`, in percent: a weapon's, and a spell gem's, which the game displays under the same name"

# ---- armour -------------------------------------------------------------

[[field]]
name = "chance_to_block"
array = "properties"
property = ["Chance to Block"]
reads = "number"
unit = "%"
whole = true
definition = "a shield's displayed `Chance to Block`, in percent"

[[field]]
name = "armour.q20"
array = "properties"
property = ["Armour"]
reads = "q20"
definition = "the displayed `Armour` at 20 % quality, as the trade site's Armour filter states it (S26): the display with the item's quality taken out and 20 % put in, rounded half up; at 20 % or more, or under `Quality does not increase Defences`, the display. Within one of the site's own figure, which works from the roll the display has rounded"

[[field]]
name = "evasion_rating.q20"
array = "properties"
property = ["Evasion Rating"]
reads = "q20"
definition = "the displayed `Evasion Rating` at 20 % quality, by `armour.q20`'s rule"

[[field]]
name = "energy_shield.q20"
array = "properties"
property = ["Energy Shield"]
reads = "q20"
definition = "the displayed `Energy Shield` at 20 % quality, by `armour.q20`'s rule"

[[field]]
name = "ward.q20"
array = "properties"
property = ["Ward"]
reads = "q20"
definition = "the displayed `Ward` at 20 % quality, by `armour.q20`'s rule"

