# The trade catalogue — v1 (C113, K6; src/trade/translate.rs), the trade-URL
# import, step 0 of search/TRADE-PLAN.md at 77666ea4.
#
# Reference data: reviewed by hand, committed, shipped inside the binary
# (`include_str!` in `src/trade/catalogue.rs`, whose loader holds a row to
# what this header says, step 3; the translation reads it at step 4),
# read-only, enumerable by
# `acq search --describe trade`, cited by version in the report of every
# answer a translation produced, its `query.trade`; the build its basis
# names digests it (C98). One row per clause the site's
# query can carry: each top-level key of the query object, each filter of
# the filters capture of 2026-09-12 (search/trade-query/data/filters-2026-09-12.json,
# 93 in 12 groups), each stat category of the stats capture (14) and each
# stat group type (8). Written by hand from search/trade-query/data/grammar.json,
# the deleted gap table (search/trade-query/data/gap.csv at 40b55e79) and
# the private API's property census (search/item-facts/data/properties-census.csv
# at 40b55e79); reviewed as a diff at each change (the admission test, the
# crate's doc, C106): what the site's own grammar says, never a judgment.
#
# What a row means. `key` is the clause as the query object spells it:
# `query.<key>` a top-level key, `<group>.<filter>` a filter, `stats.<type>`
# a group type, `stat.<category>` a stat id's category; `=<option>` after a
# key is one option of an option filter whose options land apart.
# `disposition` is K6's status for the clause when it runs: `exact`,
# `ambiguous` (runs, with `says` in the report), `unsupported` (the
# remainder), `listing_only` (no stash meaning; reported). A clause the
# site sends `disabled` is `disabled` whatever its row says.
# `lands` is the text the clause becomes (step 4, src/trade/translate.rs).
# Its placeholders are filled from the clause and never stand inside
# quotes, the loader refuses one that does: `{value}` and `{option}` are
# written through the printer's quoting, `{text}` as a stat's displays
# (its text and its forms, reference/trade-forms-v1.toml, each quoted, as
# one line's alternatives, a number its text writes as a digit a `#` of the
# template like any other: the line rules below), `{r}`, `{g}`, `{b}` and `{w}` as the
# printer writes a number, `{total}` as a computed value's name,
# `{bounds}` as the clause's `min` and `max` the way a person types them —
# `>=60`, `<=80`, `=60..80`. A term of `lands` holding a placeholder the
# clause lacks is dropped; a clause that fills none of its row's
# placeholders states nothing, and lands `true()`, the site's own no-op; a
# key absent and one sent null are alike. A stat category's row lands the
# line that selects the stat's occurrences: with no bound the clause is
# that line over every display, the stat's presence; with one it is the
# sum over the text and its plurals compared, `stat.text.bounds`. A pseudo
# with no bound is `has:` its value, `pseudo.{total}{bounds}` (C94: a total
# of nothing is lacked, as the site shows no pseudo). Every node a group
# composes is bound alone, as a clause's text is: one the binder refuses
# is its group unsupported whole, with the binder's words. An option row whose text names no
# `{option}` reads `true` as its text and `false` as the not of it. A row
# with no `lands` writes nothing, and a group's shape is its note: the
# translation composes it from its filters' texts.
# What a site object may carry is read where it stands: a filter's value
# the keys its row's `shape` names (`option` and `disabled` an option's,
# `min`, `max` and `disabled` a range's, the colours beside them the
# sockets'), a filter group `filters` and `disabled`, a stat group `type`,
# `filters`, `value` and `disabled`, its value `min` and `max` in a count
# or a weighted sum alone, a stat filter `id`, `value` and `disabled`,
# its value `min`, `max`, `option` and, in a weighted sum alone, `weight`.
# The site's `disabled` is read first; any other key no row reads makes
# unsupported, by name (`query.unknown`), the clause it could change: a
# filter, every filter of its group and the group, a stat group whole. `fields` names the
# fields of the language the text needs, each written in `lands`: the
# loader refuses one the build does not know (step 3, where the C114 fields
# landed, named by the displayed property, lowercased, spaces as
# underscores, `.of` the denominator of a `#/#` value, `.q20` a defence at
# 20 % quality: reference/properties-v1.toml). `lacked = "meets_maximum"`,
# on a row landing one field's `{bounds}` alone: an item lacking the field
# meets a maximum, and a clause with a maximum and no minimum is
# `(F<=max or -has:F)` — the site's requirement filters (u061).
# `note` is the row's evidence, its citations among it, kept in this file
# alone, and every ambiguous or unsupported clause has one. `says` is what
# the report and `--describe trade` print for the clause, in a reader's
# words with no citation, given wherever a note is (the trade seat,
# 2026-10-17). An option value or key no row names is
# unsupported by its name (K6), by `query.unknown`.
# `other`, on an ambiguous row alone, is the clause's other reading
# (C119): the fragment the clause would be read the other way, filled
# as `lands` is, beside `{term}`, the clause's own text, `{forms}`, the
# line of the stat's forms no sum holds, and `{without}`, its weighted
# sum with its own line left out against the group's bound. A reading
# applies where the clause has every property of the shape it was asked
# for, and is none elsewhere, as is one holding a placeholder its clause
# does not fill: the clause, or the weighted sum it is a line of, a
# conjunct of the query whole; `{forms}` a bound with a minimum alone in
# an `and` group, every form no sum holds the opposite word (the trade
# seat's `increased Rarity` at 20); `{without}` a filter of a bounded
# weighted sum beside another. The answer counts the items in scope the
# reading adds and drops against the query as run, each with its route
# (`answer.rs`).
#
# Measured at writing (a script over this file, never a count by eye):
# 149 rows — 4 for the URL, 10 for the query object's keys, the JSON and
# what no row names, 92 filters and 6 option rows, 10 for the stat groups
# (8 types, the disabled and the option-valued filter), 27 for the stats
# (14 categories and 13 line rules); 86 exact, 19 ambiguous, 35
# unsupported, 9 listing-only — the four defence filters ambiguous since
# step 3 measured them, and from step 4 to round x `stat.text.numbers`,
# by the owner's verdict until a sitting asked it; `stat.text.two`,
# `stat.text.numbers` and `query.unknown` are step 4's,
# `stat.text.eldritch` step 6's. Step 7e built what the sitting of
# 2026-10-16 settled: `stat.explicit`, `map_filters.area_level`, the nine
# heist skills and `weapon_filters.edps` exact; `weapon_filters.dps` and
# `pdps` on the damage at 20 % quality, within one of the site's;
# `map_filters.map_tier` ambiguous for a base naming no tier; the four
# requirement rows' `lacked`; `stat.text.forms` and `stat.text.refused`,
# and since its outside review `stat.text.wording`, the forms tables'
# (reference/trade-forms-v1.toml, trade-game-forms-v1.toml). Step 7f the
# rest: `query.term`, `uniquefoil`, `crit` and `map_blighted` exact, and
# since its outside review the two open questions labelled where they
# stand, `query.type.map` and `stat.scourge.summed`. Round x (2026-10-18)
# `map_blighted` exact again, a Blight-ravaged map no blighted one,
# `map_uberblighted` exact in its shape, and `stat.text.numbers` exact.
# Every one of the capture's 93 filters, 14 categories and 8 group types
# has a row (tests/trade_catalogue.rs). 58 fields named. Every one of the
# stat table's 14,068 category and id pairs translates, alone and with a
# bound (tests/trade_translate.rs): alone 12,719 exact, 1,120 ambiguous,
# 229 unsupported — the two-text ids, every one; with a bound 8,571, 5,268
# and 229, 4,461 of them by `stat.text.forms`; 300 by `stat.text.wording`;
# 674 by `stat.text.collision`, its texts read as templates since round x;
# 14 by `stat.text.many`, a text of two `#` compared by their mean since
# round x.

version = 1
filters = "2026-09-12"
stats = "2026-09-12"

# ---- the URL and the query object -------------------------------------

[[row]]
key = "url.realm"
disposition = "exact"
note = "`/trade/search/<league>/<id>` is pc, `/trade/search/(xbox|sony)/<league>/<id>` that console: the realm is the scope (C96), never a term; `--realm` beside a URL is a conflict"
says = "The URL's realm is the search's scope: pc, or a console; a realm named beside a URL is refused."

[[row]]
key = "url.league"
disposition = "exact"
lands = "league={value}"
fields = ["league"]
note = "the league the URL names, a term like any other (C96); a JSON envelope's `league` beside its query is read the same way (C141); a bare id names none"
says = "The league the URL names, or the query JSON carries beside its query, becomes a term of the search, like any other."

[[row]]
key = "url.poe2"
disposition = "unsupported"
note = "a `/trade2/` URL or the poe2 realm: inbound is PoE1 only (note 36 at `b6197a82`, ruling 5); refused by name before anything is decoded"
says = "A Path of Exile 2 search is not read: only Path of Exile 1 searches are."

[[row]]
key = "url.id"
disposition = "exact"
note = "the last path segment, or a bare id: the query object gzipped and base64url-encoded without padding (S56); a malformed id is a structured error"
says = "The search id, from the URL or given alone; an id that does not decode is refused."

[[row]]
key = "json"
disposition = "exact"
note = "the query JSON as the site posts it: the `{query, sort}` envelope, or the query object alone; fills no scope"
says = "The query JSON as the site posts it, with its sort or without; it names no realm."

[[row]]
key = "query.status"
text = "Status"
shape = "option"
disposition = "listing_only"
note = "online, available, securable: the seller's state, not the item's"
says = "Online, available or securable is the seller's state, not the item's, so it means nothing in your stash."

[[row]]
key = "query.term"
text = "Search"
shape = "input"
disposition = "exact"
lands = "(name={value} or base={value})"
fields = ["name", "base"]
note = "the site's free-text box matches a whole name (w06: `The Anvil`) or a whole base (w07: `Amber Amulet`, a magic `Amber Amulet of the Meteor` among them), never a word of one (t50: `Anvil`, t51: `nvil`, nothing)"
says = "The free-text box matches a whole name or a whole base, as the site's does, never a word of one."

[[row]]
key = "query.name"
text = "Name"
shape = "input"
disposition = "exact"
lands = "name={value}"
fields = ["name"]

[[row]]
key = "query.type"
text = "Base"
shape = "input"
disposition = "exact"
lands = "base={value}"
fields = ["base"]

[[row]]
key = "query.type.map"
disposition = "ambiguous"
note = "a Base naming a map's tier, ` (Tier N)`: the site returns the map's blighted form under it too, a base the body names `Blighted Map (Tier 13)` under `Map (Tier 13)` (t55), which `base=` does not match; how the site names a blighted map's base is for a sitting (`blighted-base`, tests/trade-oracle.toml)"
says = "A map base with its tier: the site also returns that tier's blighted maps under it, and this search does not."

[[row]]
key = "query.name.discriminator"
text = "Name variant"
shape = "option"
disposition = "unsupported"
note = "a `{option, discriminator}` name or type names a variant (`legacy`, a league); the name or base lands, the variant does not: a unique's variant is a parked field (decisions/search.md)"
says = "A unique's variant, such as a legacy one, is not read; its name or base is."

[[row]]
key = "query.unknown"
disposition = "unsupported"
note = "a key, a filter, a group type, an option or a value no row names or reads: unsupported by its name, never an error (K6)"
says = "A part of the search this build does not know is reported by name and not run."

[[row]]
key = "query.sort"
text = "Sort"
shape = "option"
disposition = "listing_only"
note = "carried by the JSON envelope alone, never by a URL; reported and never applied — the view is the terminal's (K6)"
says = "The site's sort is reported and not applied: order the rows yourself."

[[row]]
key = "query.stats"
text = "Stat groups"
disposition = "exact"
note = "each group by its type's row below; a group's filters are those the site leaves enabled: with none, `and`, `not` and `if` restrict nothing and write nothing — no clause where none was posted (the page posts one) — and a count or a weighted sum of none is unsupported, what the site makes of one unasked"
says = "Each stat group is read by its type; a group with no filter turned on restricts nothing."

