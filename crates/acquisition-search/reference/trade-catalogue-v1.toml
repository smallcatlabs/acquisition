# ---- the line rule (K6), for the hash categories above ------------------

[[row]]
key = "stat.text.bounds"
disposition = "exact"
note = "a bound compares the stat's sum over the lines its id admits, `sum(line(T …).arg1)`, as the site sums them (t17–t20); the text's `#` — `arg1` where it is the first number, `avg` on a ranged template, one `# to #` (S47), and on a text of exactly two `#`, their mean, as the site compares one (round x: on the Burning Ground line, 2500 for 4 seconds or 1, x14 at 1250 to 1253 found every item carrying it, x15 at 1254 to 2400 and every bracket a displayed number meets none, t28, x04–x07; the owner, 2026-10-18: \"accepted\"); where the bound admits zero — a maximum, or a minimum at or below it — the line's presence beside it, since a sum of nothing is zero (C95) and the site's stat of nothing meets no bound; a text with no `#` is presence alone, and a bound on it is dropped; `+#` is spelling and lowers"
says = "A bound compares the sum of the stat's lines, as the site sums them."

[[row]]
key = "stat.text.numbers"
disposition = "exact"
note = "a number the site's text writes as a digit and not a `#` — `per 10 Strength`, `at 25% value`, `1 Added Passive Skill is …` — is a number of the line, not the id's wording: the template has `#` there and its slot is open, so the line is met whatever the item displays there — x01 and x03's twenty Blight-ravaged maps display `at 50% value … Anointed up to 9 times` under `implicit.stat_299373046`, whose text writes 25 and 3 — and a bound compares the site's own `#`, never the digit: t30 (`min` 15) found 16 and t31 (`max` 12) found 10 on `#% increased Physical Weapon Damage per 10 Strength`, the 10 never (1,613 of the capture's 14,068 category and id pairs); two ids whose texts differ only in such a digit share the template, `stat.text.collision` (the owner, 2026-10-18, on round x: \"accepted\")"
says = "A number written into the stat's wording is a number of the line: the line matches whatever number an item shows there, and a bound compares the stat's own number."

[[row]]
key = "stat.text.many"
disposition = "ambiguous"
note = "a text with three `#` or more and no single `# to #` among them, or two beside a number its text writes as a digit (a template of three numbers): the first is compared, and which number the site compares no sitting has asked; a text of exactly two is compared by their mean, `stat.text.bounds` (round x)"
says = "A stat with three numbers or more: the first is compared, and the site may compare another."

[[row]]
key = "stat.text.local"
disposition = "ambiguous"
note = "a `(Local)` suffix is dropped — no private item displays it — and the line also matches the global twin that shows the same text (S72)"
says = "A local stat also matches the global one that reads the same."

[[row]]
key = "stat.text.collision"
disposition = "ambiguous"
note = "a text the site gives two ids or more under one category (227 explicit, 34 enchant, 20 implicit, 15 fractured, one crafted, one scourge, measured at step 4), its texts read as templates since round x, a written digit a `#` (`stat.text.numbers`: 250, 38, 25, 17, one, one — `#% increased Attack Speed per 10 Dexterity` and `per 25 Dexterity` one text): the line matches both, and the report names the other id (S66)"
says = "The site gives this wording more than one stat; the search matches all of them."

[[row]]
key = "stat.text.forms"
disposition = "ambiguous"
note = "a bound on a stat the game also displays another way (reference/trade-forms-v1.toml): the site reads the stat however displayed — `reduced` under an `increased` id below nothing (t01–t04), an elided 100 % as 100 (t10), `an` as one (t12), `No Physical Damage` at a number it hides (t07–t09, w01–w05) — and the language sums displayed lines with no sign; the bound sums the text and its plurals alone, never one moved onto a form, so the text means what it says after an edit; exact once the language can name a stat however displayed: the park \"A named stat value\" (decisions/trade.md)"
says = "The game also shows this stat another way, such as reduced for increased; the bound counts the wording given alone, where the site counts every form."
other = "({term}) -{forms}"

[[row]]
key = "stat.text.refused"
disposition = "ambiguous"
note = "a text whose forms the forms table refuses by name: its numberless display is a text the site lists under another id (`#% chance to Curse Enemies with Enfeeble on Hit` and `Curse Enemies with Enfeeble on Hit`), or it carries both words of a pair; an item's line may be either stat's, so the line matches both — the text, and the listed text the form would be"
says = "This wording may be either of two stats; the search matches both."

[[row]]
key = "stat.scourge.summed"
disposition = "ambiguous"
note = "a scourge stat in a weighted sum: e043 and f005 returned an item of crafted `+28% to Fire Resistance` and scourge `-28%` under a sum of both ids at `min` 0.5, the site's sum 28, as if it left the scourge line out; the line is summed here, and what the site does is for a sitting (`scourge-in-sum`, tests/trade-oracle.toml)"
says = "A scourge modifier in a weighted sum is counted here; the site may leave it out."
other = "{without}"

[[row]]
key = "stat.text.wording"
disposition = "ambiguous"
note = "a stat the game data also displays in another wording (reference/trade-game-forms-v1.toml, kind `other`): the line matches it, but that the site files it under the id is read from the game's stat descriptions, which no capture or sitting shows; a wording the captures show is the hand table's, exact"
says = "The game also shows this stat in another wording; the search matches it, and the site may not."

[[row]]
key = "stat.text.eldritch"
disposition = "ambiguous"
note = "in a `not`, an eldritch form's text — `While a Unique Enemy is in your Presence, …`, `While a Pinnacle Atlas Boss is in your Presence, …`: the site lets some items carrying the form through a `not` on its id (search/pseudo-stats/README.md, round four: 227 items; the trade oracle, step 6: 377), so the line excludes more than the site does"
says = "Under a not, the search leaves out every item with this eldritch modifier; the site lets some of them through."

[[row]]
key = "stat.text.rows"
disposition = "exact"
note = "a text of several rows is one line named by its whole text, a row break written `\\n` (C90)"
says = "A modifier of several lines is matched by its whole text."

[[row]]
key = "stat.text.two"
disposition = "unsupported"
note = "an id the site lists with two texts or more under one category (172 ids in the capture, 229 category and id pairs; 162 of the ids a map's own wording beside the atlas's `your Maps`): the URL names the id and not the text, and which wordings the site's id matches is for a sitting — the owner, 2026-10-15, verbatim: \"Unsupported until the sitting\""
says = "The site lists this stat with several wordings and which it matches has not been tried, so it is not run."

[[row]]
key = "stat.unknown"
disposition = "unsupported"
note = "an id the stat table does not carry, or a category no row names: unsupported by its name, never an error"
says = "A stat this build does not know is reported by name and not run."
