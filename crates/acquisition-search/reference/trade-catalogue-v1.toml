# ---- the line rule (K6), for the hash categories above ------------------

[[row]]
key = "stat.text.bounds"
disposition = "exact"
note = "`min` and `max` compare `arg1`; on a ranged template, one `# to #`, they compare `avg` (S47); a text with no `#` is presence alone; `+#` is spelling and lowers"

[[row]]
key = "stat.text.many"
disposition = "ambiguous"
note = "a template with several numbers and no single `# to #`: `arg1` is compared, and which number the site compares is for a sitting"

[[row]]
key = "stat.text.local"
disposition = "ambiguous"
note = "a `(Local)` suffix is dropped — no private item displays it — and the line also matches the global twin that shows the same text (S72)"

[[row]]
key = "stat.text.collision"
disposition = "ambiguous"
note = "a text the site gives two ids under one category (230 explicit): the line matches both, and the report names the other id (S66)"

[[row]]
key = "stat.text.rows"
disposition = "exact"
note = "a text of several rows is one line named by its whole text, a row break written `\\n` (C90)"

[[row]]
key = "stat.unknown"
disposition = "unsupported"
note = "an id the stat table does not carry, or a category no row names: unsupported by its name, never an error"
