fields = ["critical_strike_chance", "category"]
note = "the displayed `Critical Strike Chance` of a weapon: the field reads it wherever it is displayed, a spell gem's too (on the census copy of 2026-09-13, 1,047 weapons and 973 gems), and the site's weapon filter finds no gem (t44, beside t45's gems), so a gem is left out by its category"

[[row]]
key = "weapon_filters.dps"
text = "Damage per Second"
shape = "minmax"
disposition = "ambiguous"
lands = "pseudo.dps_q20{bounds}"
fields = ["pseudo.dps_q20"]
note = "the site's figure puts 20 % quality in (t42, 8 of 10 met only so); `pseudo.dps_q20` puts it in the physical range by the q20 defences' rule, within one of the site's own figure at the range's mean, which works from the roll the display has rounded (tests/trade_dps.rs)"

[[row]]
key = "weapon_filters.pdps"
text = "Physical DPS"
shape = "minmax"
disposition = "ambiguous"
lands = "pseudo.pdps_q20{bounds}"
fields = ["pseudo.pdps_q20"]
note = "as `weapon_filters.dps` (t41: 347 displayed, 416 at 20 %, meets `min` 400)"

[[row]]
key = "weapon_filters.edps"
text = "Elemental DPS"
shape = "minmax"
disposition = "exact"
lands = "pseudo.edps{bounds}"
fields = ["pseudo.edps"]
note = "quality raises no elemental damage, and `pseudo.edps` is the site's own figure on every weapon the captures fetched (tests/trade_dps.rs)"

