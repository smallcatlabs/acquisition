# The trade catalogue — v1 (C113, K6; decisions/search.md), the trade-URL
# import, step 0 of search/TRADE-PLAN.md.
#
# Reference data: reviewed by hand, committed, shipped inside the binary
# (`include_str!` in `src/trade.rs`, step 4), read-only, enumerable by
# `acq search --describe trade`, cited by version in the basis of every
# answer a translation produced (C98). One row per clause the site's
# query can carry: each top-level key of the query object, each filter of
# the filters capture of 2026-09-12 (search/trade-query/data/filters-2026-09-12.json,
# 93 in 12 groups), each stat category of the stats capture (14) and each
# stat group type (8). Written by hand from search/trade-query/data/grammar.json,
# the deleted gap table (search/trade-query/data/gap.csv at 40b55e79) and
# the private API's property census (search/item-facts/data/properties-census.csv
# at 40b55e79); reviewed as a diff at each change (the admission test, the
# crate's doc, C106): what the site's own grammar says, never a judgment.
#
# What a row means. `key` is the clause as the query object spells it:
# `query.<key>` a top-level key, `<group>.<filter>` a filter, `stats.<type>`
# a group type, `stat.<category>` a stat id's category; `=<option>` after a
# key is one option of an option filter whose options land apart.
# `disposition` is K6's status for the clause when it runs: `exact`,
# `ambiguous` (runs, with `note` in the report), `unsupported` (the
# remainder), `listing_only` (no stash meaning; reported). A clause the
# site sends `disabled` is `disabled` whatever its row says. `lands` is the
# text the clause becomes, with `{min}`, `{max}`, `{value}`, `{text}`,
# `{option}` filled from the clause; a bound the clause lacks drops its
# comparison; a row with no `lands` writes nothing. `fields` names the
# fields of the language the text needs: every one must exist when the
# loader's check arms (step 3; the C114 fields land there, named by the
# displayed property, lowercased, spaces as underscores, `.of` the
# denominator of a `#/#` value, `.q20` a defence at 20 % quality).
# `note` is what the report prints beside an ambiguous or unsupported
# clause. An option value or key no row names is unsupported by its name
# (K6).
#
# Measured at writing (a script over this file, never a count by eye):
# 136 rows — 4 for the URL, 8 for the query object's keys and the JSON,
# 92 filters and 2 option rows, 10 for the stat groups (8 types, the
# disabled and the option-valued filter), 20 for the stats (14 categories
# and 6 line rules); 80 exact, 12 ambiguous, 35 unsupported, 9
# listing-only. Every one of the capture's 93 filters, 14 categories and
# 8 group types has a row. 58 fields named, 40 of them step 3's.

version = 1
filters = "2026-09-12"
stats = "2026-09-12"

# ---- the URL and the query object -------------------------------------

[[row]]
key = "url.realm"
disposition = "exact"
note = "`/trade/search/<league>/<id>` is pc, `/trade/search/(xbox|sony)/<league>/<id>` that console: the realm is the scope (C96), never a term; `--realm` beside a URL is a conflict"

[[row]]
key = "url.league"
disposition = "exact"
lands = 'league="{value}"'
fields = ["league"]
note = "the league the URL names, a term like any other (C96); a bare id or a JSON query names none"

[[row]]
key = "url.poe2"
disposition = "unsupported"
note = "a `/trade2/` URL or the poe2 realm: inbound is PoE1 only (note 36, ruling 5); refused by name before anything is decoded"

[[row]]
key = "url.id"
disposition = "exact"
note = "the last path segment, or a bare id: the query object gzipped and base64url-encoded without padding (S56); a malformed id is a structured error"

[[row]]
key = "json"
disposition = "exact"
note = "the query JSON as the site posts it: the `{query, sort}` envelope, or the query object alone; fills no scope"

[[row]]
key = "query.status"
text = "Status"
shape = "option"
disposition = "listing_only"
note = "online, available, securable: the seller's state, not the item's"

[[row]]
key = "query.term"
text = "Search"
shape = "input"
disposition = "ambiguous"
lands = '(name:"{value}" or typeline:"{value}")'
fields = ["name", "typeline"]
note = "the site's free-text box matches names and bases by its own index; `:` is a contains test on each"

[[row]]
key = "query.name"
text = "Name"
shape = "input"
disposition = "exact"
lands = 'name="{value}"'
fields = ["name"]

[[row]]
key = "query.type"
text = "Base"
shape = "input"
disposition = "exact"
lands = 'base="{value}"'
fields = ["base"]

[[row]]
key = "query.name.discriminator"
text = "Name variant"
shape = "option"
disposition = "unsupported"
note = "a `{option, discriminator}` name or type names a variant (`legacy`, a league); the name or base lands, the variant does not: a unique's variant is a parked field (decisions/search.md)"

[[row]]
key = "query.sort"
text = "Sort"
shape = "option"
disposition = "listing_only"
note = "carried by the JSON envelope alone, never by a URL; reported and never applied — the view is the terminal's (K6)"

[[row]]
key = "query.stats"
text = "Stat groups"
disposition = "exact"
note = "each group by its type's row below; a group with no filters is no group (the page posts one)"

