# ---- stat groups (K6) ---------------------------------------------------

[[row]]
key = "stats.and"
text = "And"
disposition = "exact"
lands = "{each}"
note = "each filter a term; the one group that translates in part — a filter of it that is unsupported goes to the remainder alone"

[[row]]
key = "stats.not"
text = "Not"
disposition = "exact"
lands = "-({each} or …)"
note = "whole or not at all; a filter carrying a value is ambiguous — whether the site excludes the stat's presence or its meeting the bound is for a sitting"

[[row]]
key = "stats.if"
text = "If"
disposition = "exact"
lands = "(-line({T}) or line({T} {bounds}))"
note = "per stat, by the site's tip: match if the stat is present and meets the bound; a stat with no bound is `true()` written as the site's own no-op; whole or not at all"

[[row]]
key = "stats.count"
text = "Count"
disposition = "exact"
lands = "holds({each})={min}..{max}"
note = "by the site's tip: each stat that meets its bound counts; whole or not at all"

[[row]]
key = "stats.weight"
text = "Weighted Sum"
disposition = "exact"
lands = "sum(line(template={T} or …).{slot})>={min}/{w}"
note = "only with one weight on every stat, no per-stat bound and one slot (`arg1`, or `avg` on ranged lines alone); otherwise unsupported whole (K5: the guard a per-stat bound adds has no representation); S57"

[[row]]
key = "stats.weight2"
text = "Weighted Sum v2"
disposition = "exact"
lands = "sum(line(template={T} or …).{slot})>={min}/{w}"
note = "as `stats.weight`: with no per-stat bound the two tips state one sum"

[[row]]
key = "stats.crucible"
text = "Crucible Passive Tree Path"
disposition = "unsupported"
note = "a path of nodes to allocate at once; a private item's crucible lines carry no tree"

[[row]]
key = "stats.mercenary"
text = "Mercenary Skill Group"
disposition = "unsupported"
note = "a warrant's skill and supports; no line of the private API is read as one"

[[row]]
key = "stats.filter.disabled"
text = "a disabled stat"
disposition = "listing_only"
note = "a filter the site sends `disabled: true` is dropped and reported as disabled, whatever its category; a disabled group the same"

[[row]]
key = "stats.filter.option"
text = "a stat with an option value"
disposition = "unsupported"
note = "an option-valued stat (88 pseudos: temple rooms, implicit tiers) names a choice, not a number"

