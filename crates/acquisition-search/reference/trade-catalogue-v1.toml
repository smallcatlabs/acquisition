# ---- stat groups (K6) ---------------------------------------------------

[[row]]
key = "stats.and"
text = "And"
disposition = "exact"
note = "each filter a term of the query, as if no group held it; the one group that translates in part — a filter of it that is unsupported goes to the remainder alone"

[[row]]
key = "stats.not"
text = "Not"
disposition = "exact"
note = "`-(a or b …)`, `-a` for one filter, each filter as it lands alone; whole or not at all; a filter carrying a value is ambiguous — whether the site excludes the stat's presence or its meeting the bound is for a sitting"

[[row]]
key = "stats.if"
text = "If"
disposition = "exact"
note = "per stat, a term of the query, by the site's tip: match if the stat is present and meets the bound — `(-P or B)`, P the stat's presence and B the stat as it lands with its bounds: `(-line(T) or line(T bounds))`, `(-has:pseudo.X or pseudo.X>=v)`; a stat with no bound is `true()` written as the site's own no-op; whole or not at all"

[[row]]
key = "stats.count"
text = "Count"
disposition = "exact"
note = "`holds(a, b …)=min..max`, each filter as it lands alone: by the site's tip, each stat that meets its bound counts; the group's bounds whole numbers, one at least, or unsupported — what the site makes of a count with none is unasked; whole or not at all"

[[row]]
key = "stats.weight"
text = "Weighted Sum"
disposition = "exact"
note = "`sum(line((T source) or …).slot)=min/w..max/w`: only with one weight w above zero on every stat, no per-stat bound, a bound on the group whose quotient by w is an exact decimal, a line for every stat and one slot (the same `#` of each, or `avg` on ranged lines alone); otherwise unsupported whole (K5: the guard a per-stat bound adds has no representation); S57"

[[row]]
key = "stats.weight2"
text = "Weighted Sum v2"
disposition = "exact"
note = "as `stats.weight`: with no per-stat bound the two tips state one sum"

[[row]]
key = "stats.crucible"
text = "Crucible Passive Tree Path"
disposition = "unsupported"
note = "a path of nodes to allocate at once; a private item's crucible lines carry no tree"

[[row]]
