[package]
name = "acquisition-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# One test binary of modules (`tests/main.rs`, C122), and each file that
# sets the process environment its own: named below, never discovered.
autotests = false

[[bin]]
name = "acq-mcp"
path = "src/main.rs"

[dependencies]
acquisition-client = { path = "../acquisition-client" }
acquisition-protocol = { path = "../acquisition-protocol" }
acquisition-store = { path = "../acquisition-store" }
acquisition-plan = { path = "../acquisition-plan" }
acquisition-search = { path = "../acquisition-search" }
acquisition-verbs = { path = "../acquisition-verbs" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rmcp = { version = "3.1", features = ["transport-io"] }
# Linked through rmcp's chrono, never named in this crate's code. Its `std`
# is proptest's, a dev-dependency of the plan and the search, and a
# dev-dependency feature unifies into every test build, which gave acq-mcp
# a second form (#88, C84); compiled in always, so one build writes one binary.
num-traits = { version = "0.2", features = ["std"] }
# The same for rmcp's uuid's getrandom: proptest 1.12's chacha20 asks
# `std` and `sys_rng` of it in every test build (#125).
getrandom = { version = "0.4", features = ["std", "sys_rng"] }

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "plan_loop"
path = "tests/plan_loop.rs"
