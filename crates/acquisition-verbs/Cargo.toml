[package]
name = "acquisition-verbs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# The verbs every frontend asks (C46; roadmap/briefs/2a-design.md): what
# needs the daemon and the store together, and what every verb shares —
# the frontend's identity and door, the account, the opener, the world.
# C1, as amended: it links the client, the protocol crate, the store, the
# planner and the search; tokio for the quote's deadline and the job
# wait. Never the daemon; nothing below it links it (tools/arch-check.sh
# refuses both through the lower crates' lists).

[dependencies]
acquisition-client = { path = "../acquisition-client" }
acquisition-protocol = { path = "../acquisition-protocol" }
acquisition-store = { path = "../acquisition-store" }
acquisition-plan = { path = "../acquisition-plan" }
acquisition-search = { path = "../acquisition-search" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
# The policy test plants a newer build's value under the store's door,
# as the planner's own test does.
rusqlite = "0.32"
