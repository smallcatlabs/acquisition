[package]
name = "acquisition-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# One test binary of modules (`tests/main.rs`, C122), and each file that
# sets the process environment its own: named below, never discovered.
autotests = false

[[bin]]
name = "acq"
path = "src/main.rs"

[dependencies]
acquisition-client = { path = "../acquisition-client" }
acquisition-protocol = { path = "../acquisition-protocol" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
acquisition-store = { path = "../acquisition-store" }
acquisition-plan = { path = "../acquisition-plan" }
acquisition-search = { path = "../acquisition-search" }
acquisition-verbs = { path = "../acquisition-verbs" }
clap.workspace = true
ratatui = "0.30"
# `acq web` (C139): the loopback listener, over the hyper and tower the
# lock already holds; HTTP/1 alone, no default features.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form"] }
getrandom = "0.4"

# Linked through ratatui's crossterm on Unix, never named in this crate's
# code. Its `default` and `fs` are tempfile's, a dev-dependency of six
# crates, and a dev-dependency feature unifies into every test build, which
# gave acq a second form (#124, C84); compiled in always, so one build
# writes one binary.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "watch_recovery"
path = "tests/watch_recovery.rs"

[[test]]
name = "daemon_stalled"
path = "tests/daemon_stalled.rs"
