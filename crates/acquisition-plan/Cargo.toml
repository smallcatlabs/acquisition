[package]
name = "acquisition-plan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
acquisition-protocol = { path = "../acquisition-protocol" }
acquisition-store = { path = "../acquisition-store" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# the pricing verbs' refusals, in the words the store's own errors carry
anyhow.workspace = true

[dev-dependencies]
# the examples' and tests' only: proptest for plan step 7's properties,
# sha2 for the fixture writer (`examples/redact-pricing.rs`)
proptest = "1.11.0"
sha2 = "0.10"
# a test's own folder, removed on drop: never a name built from the pid
tempfile.workspace = true
# the write tests' second connection, holding the intent file's lock
# across a racing write as the store's own lock tests do
rusqlite = "0.32"
