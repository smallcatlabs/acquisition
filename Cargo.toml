[workspace]
resolver = "2"
members = [
    "crates/acquisition-protocol",
    "crates/acquisition-client",
    "crates/acquisition-daemon",
    "crates/acquisition-store",
    "crates/acquisition-plan",
    "crates/acquisition-search",
    "crates/acquisition-verbs",
    "crates/acquisition-cli",
    "crates/acquisition-mcp",
]

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/smallcatlabs/acquisition"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
# tests' own folders, removed when the test ends however it ends; already
# in every test build through proptest, so declaring it adds no feature (C84)
tempfile = "3"

[profile.dev]
# macOS defaults to split-debuginfo = "unpacked", which leaves every codegen
# unit's object file in target/debug/deps for the debugger to find and never
# deletes them: 600k files, 65 GB, on 2026-09-09 (note 16 at `decda84e`).
# "packed" folds them into one .dSYM per executable at link time.
split-debuginfo = "packed"
# The workspace's own crates at opt-level 1: the search's derivation and
# the listing loops are workspace code, so they ran unoptimised while
# every dependency ran optimised (below). Incremental off: a fresh
# worktree's build was 15 GB of which 9.3 GB was `incremental`, and the
# main checkout's had grown to 124 GB by 2026-10-25, since cargo never
# collects a target directory; the gate builds whole anyway. The
# measurements are in the commit that made the change.
opt-level = 1
incremental = false

# Dependencies optimised and without debug info, the workspace's own
# crates as they were (roadmap 0e, measured from an empty target dir,
# run alone): `cargo test --workspace --all-targets` 247 s to 110 s,
# the dependency-heavy tests (the store's SQLite, serde_json over item
# bodies) having run them unoptimised; a cold build 56 s to 90 s, once;
# target/ 11.3 to 9.4 GB.
# A backtrace through a dependency loses its line numbers.
[profile.dev.package."*"]
opt-level = 2
debug = false
