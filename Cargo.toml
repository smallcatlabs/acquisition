[workspace]
resolver = "2"
members = [
    "crates/acquisition-protocol",
    "crates/acquisition-client",
    "crates/acquisition-daemon",
    "crates/acquisition-transport",
    "crates/acquisition-store",
    "crates/acquisition-plan",
    "crates/acquisition-search",
    "crates/acquisition-verbs",
    "crates/acquisition-cli",
    "crates/acquisition-mcp",
]

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/smallcatlabs/acquisition"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
# tests' own folders, removed when the test ends however it ends; already
# in every test build through proptest, so declaring it adds no feature (C84)
tempfile = "3"

[profile.dev]
# macOS defaults to split-debuginfo = "unpacked", which leaves every codegen
# unit's object file in target/debug/deps for the debugger to find and never
# deletes them: one checkout's reached 600k files, 65 GB (note 16 at
# `decda84e`).
# "packed" folds them into one .dSYM per executable at link time.
split-debuginfo = "packed"
# The workspace's own crates at opt-level 1: the search's derivation and
# the listing loops are workspace code, so at opt-level 0 they would run
# unoptimised while every dependency runs optimised (below).
#
# Incremental on (the owner's ruling): the full gate after one store
# touch takes 63 s wall against 146 to 168 s with it off.
# The cost is about 5 GB of `target/debug/incremental` in each checkout
# that builds, and a stale set left behind by every compiler upgrade and
# every change of features, profile or flags, which cargo never
# collects: run `cargo clean` after each compiler upgrade. That cleanup
# is owed because the sets accumulate: a fresh worktree's build is 15 GB
# of which 9.3 GB is `incremental`, and one checkout's target reached
# 124 GB without it. CI builds
# without it: `Swatinem/rust-cache` sets CARGO_INCREMENTAL=0 in both
# gate jobs.
opt-level = 1
incremental = true
# The workspace's own crates at debug level 1 (the owner's ruling): a
# backtrace keeps its paths and line numbers and a debugger still stops
# at a line, but shows no variable and no type. Nothing had read more:
# the stacks taken of this workspace were backtraces and samples.
# Against level 2, measured from an empty target dir, run alone: the
# rebuild of every test binary after one store touch 18 s to 12 s, after
# one CLI touch 6.5 s to 3.7 s; a fresh target/ 6.8 to 5.0 GB.
# `CARGO_PROFILE_DEV_DEBUG=2` on one command brings the variables back
# for a debugger session, and leaves an incremental set of its own.
debug = 1

# Dependencies optimised and without debug info, the workspace's own
# crates as above. Against dependencies unoptimised, measured from an
# empty target dir, run alone: `cargo test --workspace --all-targets`
# 247 s to 110 s, since the dependency-heavy tests (the store's SQLite,
# serde_json over item bodies) otherwise run them unoptimised; a cold
# build 56 s to 90 s, once; target/ 11.3 to 9.4 GB.
# A backtrace through a dependency loses its line numbers.
[profile.dev.package."*"]
opt-level = 2
debug = false
